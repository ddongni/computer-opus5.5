<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>PC 분해·조립 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height service bench — 3D workbench on the left, service-manual panel on the right; stacks on phones */
:root{
  color-scheme: dark;
  --bg:#0e1319; --panel:#141b23; --raise:#1b2430; --line:#263240;
  --fg:#e4eaf0; --muted:#8d9aa9; --accent:#f0b23e; --accent-ink:#1b1405; --done:#63c2a4; --warn:#ef8a5b;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;
  padding-block:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.btn:focus-visible,.steps button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:14px;bottom:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;
  background:color-mix(in srgb,var(--bg) 70%,transparent);padding:5px 10px;border-radius:6px;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:8px;transform:translate(-9999px,0);
  font-size:13px;font-weight:600;white-space:nowrap}
.tag .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.tag .txt{background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:5px}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);
  padding:9px 16px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--done)}
.toast.off b{color:var(--warn)}

aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:20px 8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));padding-left:22px}
.meta{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.meta .pill{border:1px solid var(--line);border-radius:999px;padding:1px 9px;letter-spacing:.06em}
.meta .pill.in{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.meta .pill.out{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.card h2{margin:8px 0 0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.card .en{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.card section{margin-top:18px}
.card h3{margin:0 0 4px;font-size:11.5px;font-family:var(--f-mono);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;max-width:62ch}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.specs span{font-family:var(--f-mono);font-size:12px;background:var(--raise);border:1px solid var(--line);padding:2px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
.note{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--raise);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.note b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;padding-top:3px;color:var(--done)}
.note.caution b{color:var(--warn)}
.back{margin-top:14px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.listhead{margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.listhead h3{margin:0;font-size:11.5px;font-family:var(--f-mono);font-weight:500;letter-spacing:.14em;color:var(--muted)}
.listhead span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps button{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;text-align:left;
  background:transparent;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--muted);font-size:14px}
.steps button:hover{background:var(--raise)}
.steps .n{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.steps .st{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}
.steps li.done button{color:var(--fg)}
.steps li.done .st{color:var(--done)}
.steps li.now button{background:var(--raise);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.steps li.now .st{color:var(--accent)}

.controls{border-top:1px solid var(--line);padding-block:12px 14px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px;background:var(--panel)}
.row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.btn.primary .lab{overflow:hidden;text-overflow:ellipsis}
.btn.primary kbd{font-family:var(--f-mono);font-size:11px;opacity:.7}
.btn.small{padding:6px 10px;font-weight:500;font-size:13px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
select{background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.row .grow{flex:1}

@media (max-width: 820px){
  body{overflow:hidden}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 46svh minmax(0,1fr)}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand .sub{display:none}
  .card h2{font-size:22px}
  .scroll{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><h1>PC 분해·조립 실습</h1><span class="sub">Service bench · 3D</span></div>
    <div class="seg" role="group" aria-label="모드">
      <button id="modeAsm" aria-pressed="true">조립</button>
      <button id="modeDis" aria-pressed="false">분해</button>
    </div>
  </header>

  <div id="stage">
    <div class="tag" id="tag"><span class="dot"></span><span class="txt" id="tagText"></span></div>
    <div class="toast" id="toast" hidden><b id="toastK">POST OK</b><span id="toastT"></span></div>
    <div class="hint">드래그 회전 · 휠 확대 · 우클릭 이동 · 부품을 클릭하면 설명</div>
  </div>

  <aside>
    <div class="scroll">
      <div class="card" id="card">
        <div class="meta"><span id="stepNo">STEP 00 / 10</span><span class="pill in" id="modePill">조립</span></div>
        <h2 id="infoTitle">조립 준비</h2>
        <div class="en" id="infoEn"></div>
        <div id="infoBody"></div>
      </div>
      <div class="listhead"><h3>작업 순서</h3><span id="progTxt">0 / 10</span></div>
      <div class="bar"><i id="progBar"></i></div>
      <ol class="steps" id="stepList"></ol>
    </div>
    <div class="controls">
      <div class="row">
        <button class="btn" id="btnPrev" aria-label="이전 단계 되돌리기">◀ 이전</button>
        <button class="btn primary" id="btnNext"><span class="lab" id="nextLabel">다음</span><kbd>→</kbd></button>
      </div>
      <div class="row">
        <button class="btn small" id="btnAuto" aria-pressed="false">▶ 자동 재생</button>
        <label class="grow" for="speedSel" style="text-align:right;font-size:13px;color:var(--muted)">속도</label>
        <select id="speedSel"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.8">1.8×</option></select>
        <button class="btn small" id="btnView">시점 초기화</button>
      </div>
    </div>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">

await Promise.race([document.fonts.load('600 20px "IBM Plex Mono"').catch(() => {}), new Promise(r => setTimeout(r, 1500))]);

/* ---------------------------------------------------------------- content */
const INFO = {
  mobo:{name:'메인보드',en:'Motherboard · ATX',
    role:'모든 부품이 꽂히는 큰 기판입니다. CPU·메모리·그래픽카드·SSD가 서로 데이터를 주고받는 통로와, 각 부품에 전기를 나눠 주는 회로가 여기에 모여 있습니다. 컴퓨터의 도로망이자 배전반이라고 보면 됩니다.',

  gpu:{name:'그래픽카드 (GPU)',en:'Graphics Card',
    role:'화면에 보일 이미지를 계산합니다. 수천 개의 작은 코어가 동시에 일해서 게임의 3D 그래픽, 영상 편집, AI 연산처럼 같은 계산을 대량으로 반복하는 일에 강합니다. 모니터 케이블도 여기에 꽂습니다.',

/* ---------------------------------------------------------------- state & motion */
const ACC = new THREE.Color(0xf0b23e);
const state = {power:0};
let power = 0;
const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const _q = new THREE.Quaternion();
function poseAt(p, s){
  const lift = p.stPos.clone().add(new V(0, p.lift, 0));
  const appr = p.inPos.clone().addScaledVector(p.dir, p.approach);
  if (s <= 0) { p.group.position.copy(p.stPos); p.group.quaternion.copy(p.stQ); return; }
  if (s >= 1) { p.group.position.copy(p.inPos); p.group.quaternion.copy(p.inQ); return; }
  if (s < 0.2) { p.group.position.copy(p.stPos).lerp(lift, ease(s/0.2)); p.group.quaternion.copy(p.stQ); }
  else if (s < 0.72) {
    const u = ease((s - 0.2)/0.52);
    p.group.position.copy(lift).lerp(appr, u); p.group.position.y += Math.sin(Math.PI*u)*5;
    p.group.quaternion.copy(_q.slerpQuaternions(p.stQ, p.inQ, u));
  } else { p.group.position.copy(appr).lerp(p.inPos, easeOut((s - 0.72)/0.28)); p.group.quaternion.copy(p.inQ); }
}
function setPartState(id, on){
  state[id] = on;
  if (id === 'power') { power = on ? 1 : 0; return; }
  const p = parts[id];
  if (p.isCable) setCable(on ? 1 : 0); else poseAt(p, on ? 1 : 0);
}

let mode = 'asm', steps = ASM, cur = 0, anim = null, speed = 1, auto = false, autoTimer = null, selected = null, hover = null;
function initialOn(){ return mode === 'dis'; }
function applyInstant(n){
  const on = initialOn();
  for (const id of Object.keys(parts)) setPartState(id, on);
  setPartState('power', on);
  for (let i = 0; i < n; i++) setPartState(steps[i].id, steps[i].dir === 'in');
}
function runStep(step, reverse, onDone){
  const toIn = (step.dir === 'in') !== reverse;
  let dur, update;
  if (step.id === 'power') { dur = 1.6; update = t => { power = toIn ? t : 1 - t; }; }
  else if (step.id === 'cables') { dur = 2.4; update = t => setCable(toIn ? ease(t) : 1 - ease(t)); }
  else { const p = parts[step.id]; dur = 2.9; update = t => poseAt(p, toIn ? t : 1 - t); }
  anim = {t:0, dur:dur/speed, update, id:step.id, done:() => { setPartState(step.id, toIn); onDone && onDone(); }};
  if (step.id === 'power') showToast(toIn);
}

function next(){

function prev(){

}
function afterStep(){
  refresh();
  if (auto) { if (cur < steps.length) autoTimer = setTimeout(next, 900/speed); else stopAuto(); }
}
function stopAuto(){ auto = false; clearTimeout(autoTimer); $('btnAuto').setAttribute('aria-pressed', 'false'); $('btnAuto').textContent = '▶ 자동 재생'; }
function setMode(m){
  if (anim) { anim.update(1); anim.done = () => {}; anim = null; }
  stopAuto(); mode = m; steps = m === 'asm' ? ASM : DIS; cur = 0; selected = null;
  $('modeAsm').setAttribute('aria-pressed', m === 'asm'); $('modeDis').setAttribute('aria-pressed', m === 'dis');
  applyInstant(0); flyTo('overview'); refresh();
}
$('modeAsm').onclick = () => setMode('asm');
$('modeDis').onclick = () => setMode('dis');
$('btnNext').onclick = next;
$('btnPrev').onclick = prev;
$('btnView').onclick = () => flyTo('overview');
$('speedSel').onchange = e => { speed = parseFloat(e.target.value); };
$('btnAuto').onclick = () => {
  if (auto) { stopAuto(); return; }
  if (cur >= steps.length) { applyInstant(0); cur = 0; refresh(); }
  auto = true; $('btnAuto').setAttribute('aria-pressed', 'true'); $('btnAuto').textContent = '❚❚ 일시 정지';
  if (!anim) next();
};
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('select')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

let toastTimer;
function showToast(on){
  const t = $('toast');
  t.classList.toggle('off', !on);
  $('toastK').textContent = on ? 'POST OK' : 'POWER OFF';
  $('toastT').textContent = on ? 'CPU · 메모리 32GB · 그래픽카드 · SSD 인식 완료' : '전원 차단 · 잔류 전원 방전 완료';
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
}

/* ---------------------------------------------------------------- picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
function pickAt(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object; if (!o.visible || o.userData.noPick) continue;
    const id = o.userData.partId; if (!id) continue;
    if (id === 'panel' && state.panel && o === parts.panel.glass) continue;
    return id;
  }
  return null;
}
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
  if (moved > 6) return;
  const id = pickAt(e);
  selected = id; renderInfo();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) return;
  hover = pickAt(e);
  renderer.domElement.style.cursor = hover ? 'pointer' : '';
});
renderer.domElement.addEventListener('pointerleave', () => { hover = null; });

/* ---------------------------------------------------------------- loop */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const tagEl = $('tag'), tagTxt = $('tagText');
const bb = new THREE.Box3(), bc = new V();
const clock = new THREE.Clock();
const tmpC = new THREE.Color();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (anim) { anim.t += dt; const t = Math.min(anim.t/anim.dur, 1); anim.update(t); if (t >= 1) { const a = anim; anim = null; a.done(); if (!a.prev) refresh(); } }
  if (camTween) {
    camTween.t += dt; const u = ease(Math.min(camTween.t/camTween.dur, 1));
    controls.target.lerpVectors(camTween.fT, camTween.tT, u); camera.position.lerpVectors(camTween.fP, camTween.tP, u);
    if (camTween.t >= camTween.dur) camTween = null;
  }
  for (const f of fans) f.rotor.rotation.z += dt * f.spin * power;
  for (const m of rgbMats) { tmpC.setHSL((time*0.07 + m.userData.hue) % 1, 0.75, 0.55); m.emissive.copy(tmpC); m.emissiveIntensity = power * 2.2; }
  ledMat.emissive.set(0xf0b23e); ledMat.emissiveIntensity = power * 2.5;
  glow.intensity = power * 120;

  const aid = anim && anim.id !== 'power' ? anim.id : null;
  for (const p of Object.values(parts)) {
    const k = p.id === aid ? 0.32 + 0.18*Math.sin(time*7) : p.id === hover ? 0.2 : p.id === selected ? 0.14 : 0;
    if (Math.abs(k - p.hl) < 0.001) continue;
    p.hl = k; for (const m of p.mats) { m.emissive.copy(ACC); m.emissiveIntensity = k; }
  }
  const tagId = aid || selected;
  if (tagId && tagId !== 'case' && (tagId !== 'cables' || state.cables || aid)) {
    bb.setFromObject(parts[tagId].group); bb.getCenter(bc); bc.y = bb.max.y + 1;
    bc.project(camera);
    const x = (bc.x*0.5 + 0.5)*stage.clientWidth, y = (-bc.y*0.5 + 0.5)*stage.clientHeight;
    tagTxt.textContent = INFO[tagId].name;
    tagEl.style.transform = bc.z < 1 ? `translate(${Math.round(x - 5)}px, ${Math.round(y - 30)}px)` : 'translate(-9999px,0)';
  } else tagEl.style.transform = 'translate(-9999px,0)';

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

applyInstant(0);
{ const [t, p] = viewVec('overview'); controls.target.copy(t); camera.position.copy(p); }
refresh();
frame();
</script>
