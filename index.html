<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>PC 분해·조립 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height service bench — 3D workbench on the left, service-manual panel on the right; stacks on phones */
:root{
  color-scheme: dark;
  --bg:#0e1319; --panel:#141b23; --raise:#1b2430; --line:#263240;
  --fg:#e4eaf0; --muted:#8d9aa9; --accent:#f0b23e; --accent-ink:#1b1405; --done:#63c2a4; --warn:#ef8a5b;
  --f-power:#f0b23e; --f-net:#5fd4ff; --f-video:#b18cff; --f-input:#6fe08a; --f-mgmt:#ff7ab8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;
  padding-block:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.scn button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,.steps button:focus-visible,select:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#stage canvas.gl{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:14px;bottom:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;
  background:color-mix(in srgb,var(--bg) 70%,transparent);padding:5px 10px;border-radius:6px;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:8px;transform:translate(-9999px,0);font-size:13px;font-weight:600;white-space:nowrap}
.tag .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.tag .txt{background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:5px}
.toast{position:absolute;left:14px;bottom:52px;background:var(--raise);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 28px)}
.toast b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--done)}
.toast.off b{color:var(--warn)}
.screen{position:absolute;right:14px;top:14px;width:min(44%,440px);background:#05070a;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.screen.big{width:min(86%,900px)}
.scrbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 6px 5px 10px;background:var(--raise);font-size:12.5px;font-weight:600}
.scrbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:1px 8px;font-size:12px;cursor:pointer;flex:none}
#scrCanvas{display:block;width:100%;height:auto}
.legend{position:absolute;right:14px;bottom:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 12px;max-width:60%;
  background:color-mix(in srgb,var(--bg) 78%,transparent);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:20px 8px;padding-left:22px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.meta{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.meta .pill{border:1px solid var(--line);border-radius:999px;padding:1px 9px;letter-spacing:.06em}
.meta .pill.in{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.meta .pill.out{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.card h2{margin:8px 0 0;font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.card .en{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.card section{margin-top:18px}
.card h3{margin:0 0 4px;font-size:11.5px;font-family:var(--f-mono);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;max-width:62ch}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.specs span{font-family:var(--f-mono);font-size:12px;background:var(--raise);border:1px solid var(--line);padding:2px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
.note{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--raise);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.note b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;padding-top:3px;color:var(--done)}
.note.caution b{color:var(--warn)}
.note.flow b{color:var(--f-net)}
.back{margin-top:14px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.listhead{margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.listhead h3{margin:0;font-size:11.5px;font-family:var(--f-mono);font-weight:500;letter-spacing:.14em;color:var(--muted)}
.listhead span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);padding:12px 8px 2px;border-top:1px dashed var(--line);margin-top:6px}
.steps li.sec:first-child{border-top:0;margin-top:0;padding-top:4px}
.steps button{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;text-align:left;
  background:transparent;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--muted);font-size:14px}
.steps button:hover{background:var(--raise)}
.steps .n{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.steps .st{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}
.steps li.done button{color:var(--fg)}
.steps li.done .st{color:var(--done)}
.steps li.now button{background:var(--raise);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.steps li.now .st{color:var(--accent)}

.controls{border-top:1px solid var(--line);padding-block:12px 14px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px;background:var(--panel)}
.row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.btn.primary .lab{overflow:hidden;text-overflow:ellipsis}
.btn.primary kbd{font-family:var(--f-mono);font-size:11px;opacity:.7}
.btn.small{padding:6px 10px;font-weight:500;font-size:13px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
select{background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.row .grow{flex:1}

@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 46svh minmax(0,1fr)}
  aside{border-left:0;border-top:1px solid var(--line)}
  .brand .sub{display:none}
  .card h2{font-size:22px}
  .scroll{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .hint{display:none}
  .screen{width:52%}
  .screen.big{width:calc(100% - 28px)}
  .legend{max-width:calc(100% - 28px);left:14px;right:auto;justify-content:flex-start}
}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><h1>PC 분해·조립 실습</h1><span class="sub">Service bench · 3D</span></div>
    <div class="switches">
      <div class="seg scn" role="group" aria-label="실습 종류">
        <button id="scnPC" aria-pressed="true">개인 PC</button>
        <button id="scnSRV" aria-pressed="false">회사 서버</button>
      </div>
      <div class="seg" role="group" aria-label="모드">
        <button id="modeAsm" aria-pressed="true">조립</button>
        <button id="modeDis" aria-pressed="false">분해</button>
      </div>
    </div>
  </header>

  <div id="stage">
    <div class="tag" id="tag"><span class="dot"></span><span class="txt" id="tagText"></span></div>
    <div class="screen" id="scr" hidden>
      <div class="scrbar"><span id="scrTitle">모니터 화면</span><button class="mini" id="scrSize">확대</button></div>
      <canvas id="scrCanvas" width="960" height="600"></canvas>
    </div>
    <div class="toast" id="toast" hidden><b id="toastK">POST OK</b><span id="toastT"></span></div>
    <div class="legend" id="legend" hidden></div>
    <div class="hint">드래그 회전 · 휠 확대 · 우클릭 이동 · 부품을 클릭하면 설명</div>
  </div>

  <aside>
    <div class="scroll">
      <div class="card" id="card">
        <div class="meta"><span id="stepNo">STEP 00 / 10</span><span class="pill in" id="modePill">조립</span></div>
        <h2 id="infoTitle">조립 준비</h2>
        <div class="en" id="infoEn"></div>
        <div id="infoBody"></div>
      </div>
      <div class="listhead"><h3>작업 순서</h3><span id="progTxt">0 / 10</span></div>
      <div class="bar"><i id="progBar"></i></div>
      <ol class="steps" id="stepList"></ol>
    </div>
    <div class="controls">
      <div class="row">
        <button class="btn" id="btnPrev" aria-label="이전 단계 되돌리기">◀ 이전</button>
        <button class="btn primary" id="btnNext"><span class="lab" id="nextLabel">다음</span><kbd>→</kbd></button>
      </div>
      <div class="row">
        <button class="btn small" id="btnAuto" aria-pressed="false">▶ 자동 재생</button>
        <label class="grow" for="speedSel" style="text-align:right;font-size:13px;color:var(--muted)">속도</label>
        <select id="speedSel"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.8">1.8×</option></select>
        <button class="btn small" id="btnView">시점 초기화</button>
      </div>
    </div>
  </aside>
</div>

<script type="importmap">

} }

    note:['TIP','써멀 그리스는 CPU와 쿨러 사이의 미세한 틈을 메워 열이 잘 전달되게 합니다. 너무 많이 바르면 오히려 옆으로 넘칩니다.']},

    in:'M.2 슬롯에 약 30도 각도로 비스듬히 밀어 넣은 뒤, 끝을 눌러 눕히고 고정 나사(또는 래치)로 잠급니다. 방열판이 있다면 보호 필름을 떼고 덮습니다.',

    specs:['M.2 2280','PCIe 4.0 ×4','1TB · 7,000MB/s']},
  psu:{name:'파워서플라이 (PSU)',en:'Power Supply Unit',
    role:'벽 콘센트의 교류 220V를 부품이 쓰는 직류 12V·5V·3.3V로 바꿔 공급합니다. 전기가 흔들리면 컴퓨터 전체가 불안정해지므로 품질이 중요한 부품입니다.',
    in:'케이스 아래쪽 뒤편 자리에 밀어 넣습니다. 케이스 바닥에 먼지 필터가 있으면 팬이 아래를 향하게 두고, 케이스 뒤쪽에서 나사 4개로 고정합니다.',
    out:'전원 코드와 부품에 꽂힌 케이블을 모두 뺀 뒤, 케이스 뒤쪽 나사 4개를 풀고 안쪽으로 당겨 꺼냅니다.',
    specs:['850W','80 PLUS Gold','풀 모듈러'],
    caution:'파워서플라이 내부 커패시터에는 전원을 뽑은 뒤에도 전기가 남아 있습니다. 본체 덮개는 절대 열지 마세요.'},
  gpu:{name:'그래픽카드 (GPU)',en:'Graphics Card',
    role:'화면에 보일 이미지를 계산합니다. 수천 개의 작은 코어가 동시에 일해서 게임의 3D 그래픽, 영상 편집, AI 연산처럼 같은 계산을 대량으로 반복하는 일에 강합니다. 모니터 케이블도 여기에 꽂습니다.',
    in:'케이스 뒤쪽 슬롯 덮개 2~3개를 뗍니다. CPU에 가장 가까운 PCIe x16 슬롯에 금색 단자를 맞추고, 슬롯 걸쇠가 "딸깍" 잠길 때까지 수직으로 누른 뒤 브래킷을 나사로 고정합니다.',
    out:'보조전원 케이블을 먼저 뽑고 브래킷 나사를 풉니다. 슬롯 끝의 걸쇠를 누른 채로 카드를 수직으로 당겨 뺍니다.',
    specs:['PCIe 4.0 x16','12GB GDDR6X','3팬 · 2.5슬롯'],
    note:['TIP','무거운 카드는 시간이 지나며 처질 수 있어서 받침대(GPU 지지대)를 함께 쓰기도 합니다.']},
  cables:{name:'내부 전원 케이블',en:'24-pin ATX · 8-pin EPS · 8-pin PCIe',
    role:'파워서플라이의 전기를 각 부품으로 나릅니다. 메인보드에는 24핀, CPU에는 8핀(EPS), 그래픽카드에는 8핀(PCIe) 커넥터가 들어갑니다.',
    in:'커넥터는 맞는 방향으로만 들어가도록 모양이 잡혀 있습니다. 걸쇠(클립) 방향을 확인하고 끝까지 밀어 "딸깍" 걸리게 합니다. 남는 케이블은 메인보드 뒤쪽으로 돌려 정리하면 공기 흐름이 좋아집니다.',
    out:'커넥터의 걸쇠를 엄지로 누른 상태에서 커넥터 몸통을 잡고 뽑습니다. 전선을 잡아당기면 단자가 빠질 수 있습니다.',
    specs:['ATX 24핀 → 메인보드','EPS 8핀 → CPU','PCIe 8핀 → GPU'],
    hin:'연결 방법',hout:'분리 방법'},
  panel:{name:'측면 패널',en:'Tempered Glass Side Panel',
    role:'내부 부품을 먼지와 충격에서 지키고, 케이스의 공기 흐름(앞에서 들어와 뒤·위로 나가는 길)이 설계대로 유지되게 합니다.',
    in:'패널을 케이스 걸림 홈에 맞춰 세우고 손나사 4개로 고정합니다. 손나사는 손으로만 조여도 충분합니다.',
    out:'손나사를 풀면서 다른 손으로 패널을 받칩니다. 떼어 낸 유리는 바닥에 눕혀 둡니다.',
    specs:['강화유리 4mm','손나사 ×4'],
    caution:'강화유리는 모서리에 충격을 받으면 한 번에 깨집니다. 세워 두지 말고 눕혀서 보관하세요.',
    hin:'닫는 방법',hout:'여는 방법'},
  monitor:{name:'모니터',en:'Display · Output device',
    role:'컴퓨터가 계산한 결과를 눈으로 볼 수 있게 보여 주는 출력 장치입니다. 그래픽카드가 만든 화면 신호를 DisplayPort·HDMI 케이블로 받아 1초에 60~240번 새로 그립니다.',
    in:'모니터 케이블은 메인보드가 아니라 그래픽카드 뒤쪽 포트에 꽂아야 합니다. 메인보드 포트에 꽂으면 그래픽카드를 쓰지 않거나 화면이 아예 나오지 않습니다.',
    out:'케이블 양쪽 끝의 커넥터를 잡고 뽑습니다. DisplayPort는 커넥터 위쪽 걸쇠 버튼을 누른 채 뽑아야 합니다.',
    specs:['DisplayPort 1.4','27인치 QHD','PC → 모니터'],
    flow:'보라색 점이 영상 신호입니다. 그래픽카드에서 모니터 쪽으로 한 방향으로만 흐릅니다.'},
  input:{name:'키보드 · 마우스',en:'Input devices · USB',
    role:'사람의 손동작을 신호로 바꿔 컴퓨터에 전달하는 입력 장치입니다. 키를 누르거나 마우스를 움직이면 USB를 통해 1초에 수백~수천 번 보고하고, CPU가 처리한 결과가 다시 모니터에 나타납니다.',
    in:'본체 뒤쪽 메인보드 I/O 패널의 USB 포트에 꽂습니다. USB-A는 한쪽 방향으로만 들어가니 안 들어가면 뒤집으세요. 꽂으면 운영체제가 자동으로 인식합니다.',
    out:'USB 커넥터를 잡고 곧게 뽑습니다. 무선 제품이라면 수신기(동글)를 뽑습니다.',
    specs:['USB 2.0','1000Hz 폴링','키보드·마우스 → PC'],
    flow:'초록색 점이 입력 신호입니다. 키보드 → USB → CPU → 그래픽카드 → 모니터 순서로 입력과 출력이 이어집니다. 모니터 화면에 글자가 찍히는 것을 확인해 보세요.'},
  lan:{name:'네트워크 (LAN)',en:'Ethernet · RJ45',
    role:'다른 컴퓨터, 그리고 인터넷과 데이터를 주고받는 통로입니다. PC의 랜 포트에서 공유기로, 공유기에서 통신사 장비(ONT)를 거쳐 인터넷으로 나갑니다. 데이터는 작은 묶음(패킷)으로 나뉘어 양방향으로 오갑니다.',
    in:'랜 케이블을 메인보드 I/O의 RJ45 포트와 공유기의 LAN 포트에 "딸깍" 소리가 나게 꽂습니다. 연결되면 포트 옆 LED가 깜빡이고, 공유기가 PC에 192.168.0.x 주소를 자동으로 나눠 줍니다(DHCP).',
    out:'커넥터 위쪽의 플라스틱 걸쇠를 누른 채로 뽑습니다. 걸쇠를 누르지 않고 당기면 걸쇠가 부러집니다.',
    specs:['Cat6 케이블','1 / 2.5 Gbps','PC ↔ 공유기 ↔ 인터넷'],
    flow:'하늘색 점이 네트워크 패킷입니다. 보내기(업로드)와 받기(다운로드)가 동시에 일어나서 양쪽으로 움직입니다.'},
  cord:{name:'전원 코드',en:'AC Power Cord',
    role:'멀티탭의 교류 전기를 파워서플라이로 공급합니다. 파워서플라이가 이를 직류로 바꿔 안쪽 케이블로 각 부품에 나눠 줍니다.',
    in:'모든 연결을 마친 뒤 가장 마지막에 전원 코드를 꽂습니다. 파워서플라이 뒤쪽 스위치가 O(꺼짐)인지 먼저 확인하고, 꽂은 다음 I(켜짐)로 바꿉니다.',
    out:'시스템을 종료하고 파워서플라이 스위치를 O로 내린 뒤 코드를 뽑습니다. 분해할 때는 전원을 끊는 것이 반드시 맨 처음이어야 합니다.',
    specs:['AC 220V · 60Hz','C13 커넥터','멀티탭 → PSU'],
    flow:'노란색 점이 전력입니다. 컴퓨터가 꺼져 있어도 메인보드에는 대기 전력이 흐르고 있습니다.'},
  power:{name:'전원 켜기',en:'Power On · POST · Data flow',
    role:'모든 부품이 연결되면 전원을 넣어 정상 동작을 확인합니다. 켜지는 순간 메인보드가 CPU·메모리·그래픽카드를 차례로 점검하는데, 이 과정을 POST(Power-On Self-Test)라고 합니다. 이어서 운영체제가 뜨면 입력·출력·네트워크가 모두 움직이기 시작합니다.',
    in:'케이스 전원 버튼을 누르면 팬이 돌기 시작하고, 모니터에 바이오스 화면이 지나간 뒤 바탕화면이 나타납니다. 화면 속 점들이 케이블을 따라 어떻게 흐르는지 살펴보세요.',
    out:'운영체제에서 시스템 종료를 누릅니다. 팬이 멈추고 모니터가 "신호 없음"으로 바뀌면 꺼진 것입니다. 전원 버튼을 5초 정도 눌러 남은 전기를 빼고, 케이스 금속 부분을 만져 몸의 정전기를 없앱니다.',
    specs:['POST','BIOS / UEFI'],
    flow:'노랑 = 전력, 하늘 = 네트워크, 보라 = 영상 출력, 초록 = 키보드·마우스 입력. 오른쪽 아래 범례에서 지금 흐르는 신호를 볼 수 있습니다.',
    hin:'켜는 방법',hout:'끄는 방법'},
  case:{name:'케이스',en:'Mid-Tower Case',
    role:'모든 부품을 고정하는 뼈대입니다. 앞쪽 팬이 찬 공기를 빨아들이고 뒤쪽 팬이 뜨거운 공기를 내보내 내부 온도를 낮춥니다. 뒷면에는 메인보드 I/O, 그래픽카드 포트, 전원 단자가 모여 있습니다.',
    specs:['미들타워','흡기 팬 ×2','배기 팬 ×1']},
  strip:{name:'멀티탭',en:'Power Strip',
    role:'벽 콘센트 하나로 PC·모니터·공유기에 전기를 나눠 줍니다. 과부하 차단 기능이 있는 제품을 쓰는 것이 안전하고, 멀티탭에 멀티탭을 이어 꽂는 것은 피해야 합니다.',specs:['과부하 차단','개별 스위치']},
  router:{name:'공유기 · ONT',en:'Router · Optical Network Terminal',
    role:'공유기는 집이나 사무실의 여러 기기에 내부 주소(192.168.x.x)를 나눠 주고, 바깥 인터넷과 오가는 패킷의 길을 찾아 줍니다. ONT는 통신사의 광케이블 신호를 이더넷 신호로 바꾸는 장비입니다.',specs:['DHCP','NAT','기가비트 LAN ×4']},

  /* ---- server ---- */
  lid:{name:'서버 덮개',en:'Chassis Cover',
    role:'서버 내부를 덮어 먼지를 막고, 앞쪽 팬이 빨아들인 공기가 부품 위로 정확히 흐르도록 바람길을 만듭니다. 덮개를 연 채로 오래 켜 두면 냉각이 제대로 되지 않습니다.',
    in:'덮개를 홈에 맞춰 내려놓고 앞으로 밀어 윗면 잠금 레버를 닫습니다.',
    out:'윗면 잠금 레버를 들어 올려 덮개를 밀고 위로 들어 냅니다. 작업 전에 정전기 방지 손목 밴드를 섀시 금속 부분에 연결합니다.',
    specs:['2U 섀시','공구 없이 분리'],hin:'닫는 방법',hout:'여는 방법'},
  sram:{name:'ECC 메모리',en:'DDR5 ECC RDIMM × 8',
    role:'서버용 메모리는 ECC(오류 정정 코드)를 지원해서, 비트 하나가 저절로 뒤집혀도 스스로 고칩니다. 몇 달씩 쉬지 않고 돌아가는 서버에서 데이터가 조용히 깨지는 것을 막아 줍니다.',
    in:'CPU가 2개이므로 CPU마다 같은 수, 같은 위치의 슬롯에 나눠 꽂아야 메모리 채널을 모두 씁니다. 덮개 안쪽의 슬롯 배치도를 확인하고, 노치를 맞춰 양쪽 걸쇠가 닫힐 때까지 수직으로 누릅니다.',
    out:'양쪽 걸쇠를 눌러 열고 수직으로 뽑아 정전기 방지 봉투에 담습니다.',
    specs:['32GB × 8 = 256GB','DDR5-4800 RDIMM','CPU당 4채널']},
  drives:{name:'핫스왑 디스크',en:'Hot-swap SSD × 4',
    role:'서버 앞쪽 베이에 꽂는 저장장치입니다. 핫스왑이라서 서버가 켜진 상태에서도 고장 난 디스크만 빼고 새것으로 바꿀 수 있습니다. 2개씩 묶어 RAID 1로 구성하면 하나가 고장 나도 데이터가 남습니다.',
    in:'트레이 레버를 연 상태로 베이에 끝까지 밀어 넣고 레버를 닫아 잠급니다. 베이 번호(0~3)를 기억해 두면 RAID 구성할 때 편합니다.',
    out:'트레이 버튼을 눌러 레버를 열고 당겨 뺍니다. 반납·폐기하는 서버라면 디스크 데이터를 완전 삭제(Secure Erase)하거나 물리적으로 파기합니다.',
    specs:['960GB × 2 (OS)','3.84TB × 2 (데이터)','앞면 핫스왑 베이'],
    caution:'철거할 때 디스크 데이터를 지우지 않고 반출하면 정보 유출 사고로 이어집니다.'},
  rails:{name:'슬라이드 레일',en:'Rail Kit',
    role:'서버 무게를 받치고 서랍처럼 앞으로 당겨 뺄 수 있게 해 주는 레일입니다. 랙 앞뒤 기둥에 걸어 고정합니다.',
    in:'설치할 높이(U 번호)를 정하고 앞·뒤 기둥의 같은 구멍 높이에 레일을 겁니다. 이 실습에서는 14~15U에 2U 서버를 넣습니다. 무거운 장비일수록 아래쪽에 두는 것이 원칙입니다.',
    out:'서버를 빼낸 뒤 레일의 잠금 탭을 누르고 기둥에서 빼냅니다.',
    specs:['19인치 랙 규격','1U = 44.45mm','공구 없는 래치']},
  server:{name:'랙 서버',en:'2U Rack Server · web-01',
    role:'회사의 웹사이트, 데이터베이스, 사내 시스템 같은 서비스를 24시간 돌리는 컴퓨터입니다. CPU 2개, 이중 전원, 원격 관리 칩(BMC)처럼 개인 PC에는 없는 "멈추지 않기 위한" 장치가 들어 있습니다.',
    in:'두 사람이 양쪽을 들고 서버 옆면의 안쪽 레일을 랙 레일에 맞춘 뒤 끝까지 밀어 넣습니다. 앞쪽 손잡이의 나사로 고정합니다.',
    out:'케이블을 모두 분리하고 앞쪽 고정 나사를 푼 뒤, 서버를 당겨 레일 끝의 잠금 탭을 누르고 두 사람이 들어서 빼냅니다.',
    specs:['2U · 약 25kg','CPU 2개 · 48코어','이중 전원 · BMC'],
    caution:'2U 서버는 20kg이 넘습니다. 혼자 들지 말고 반드시 두 사람이 작업하세요.'},
  spower:{name:'이중 전원 연결',en:'Redundant PSU · PDU A/B',
    role:'서버에는 파워서플라이가 2개 있습니다. 하나는 PDU A(빨강), 다른 하나는 PDU B(파랑)에 꽂아 서로 다른 전원 계통을 씁니다. 한쪽 전기가 끊겨도 다른 쪽으로 계속 돌아갑니다.',
    in:'PSU 1 → PDU A, PSU 2 → PDU B로 꽂고 케이블이 빠지지 않게 고정 클립을 겁니다. 두 개를 같은 PDU에 꽂으면 이중화가 의미 없어집니다.',

const actors = {pc:{}, srv:{}};

  group.traverse(o => {

    o.castShadow = !o.userData.noShadow; o.receiveShadow = true;
    if (o.userData.actor) return;
    o.userData.actor = a;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material])) if (!m.userData.keepEmissive && !a.mats.includes(m)) a.mats.push(m);

}

function poseAt(a, s){
  const g = a.group;
  if (s <= 0) { g.position.copy(a.stPos); g.quaternion.copy(a.stQ); return; }
  if (s >= 1) { g.position.copy(a.inPos); g.quaternion.copy(a.inQ); return; }
  const lift = a.stPos.clone().add(new V(0, a.lift, 0));
  const appr = a.inPos.clone().addScaledVector(a.dir, a.approach);
  if (s < 0.2) { g.position.copy(a.stPos).lerp(lift, ease(s/0.2)); g.quaternion.copy(a.stQ); }
  else if (s < 0.72) { const u = ease((s - 0.2)/0.52); g.position.copy(lift).lerp(appr, u); g.position.y += Math.sin(Math.PI*u)*5; g.quaternion.slerpQuaternions(a.stQ, a.inQ, u); }
  else { g.position.copy(appr).lerp(a.inPos, easeOut((s - 0.72)/0.28)); g.quaternion.copy(a.inQ); }
}

    dir:o.dir||new V(0,0,1), approach:o.approach, lift:o.lift ?? 18, on:false};
  a.set = on => { a.on = on; poseAt(a, on ? 1 : 0); };

}

  if (camTween) {
    camTween.t += dt; const u = ease(Math.min(camTween.t/camTween.dur, 1));
    controls.target.lerpVectors(camTween.fT, camTween.tT, u); camera.position.lerpVectors(camTween.fP, camTween.tP, u);
    if (camTween.t >= camTween.dur) camTween = null;
  }
  for (const f of fans) if (f.sc === scen) f.rotor.rotation.z += dt*f.spin*power[f.sc];
  for (const m of rgbMats) { tmpC.setHSL((now*0.07 + m.userData.hue) % 1, 0.75, 0.55); m.emissive.copy(tmpC); m.emissiveIntensity = power.pc*2.2; }
  for (const b of blinkers) {
    if (b.sc !== scen) continue;
    const on = b.cond();
    b.m.emissive.copy(b.color);
    b.m.emissiveIntensity = !on ? 0 : b.rate ? (Math.sin(now*b.rate + b.phase) + Math.sin(now*b.rate*1.7 + b.phase*2) > 0.3 ? 2.6 : 0.35) : 2.2;
  }
  glow.intensity = scen === 'pc' ? power.pc*120 : 0;
  const kinds = new Set();
  for (const f of flows) {
    if (f.sc !== scen) continue;
    const on = f.cond();
    if (on) kinds.add(f.kind);
    for (const d of f.dots) {
      d.s.visible = on;
      if (on) { let u = (now*f.v + d.off) % 1; if (d.d < 0) u = 1 - u; f.curve.getPointAt(u, d.s.position); }
    }
  }
  const lk = [...kinds].sort().join(',');
  if (lk !== legendKey) {
    legendKey = lk; legendEl.hidden = !lk;
    legendEl.innerHTML = ['power', 'net', 'mgmt', 'video', 'input'].filter(k => kinds.has(k)).map(k => `<span><i style="background:var(--f-${k})"></i>${COLNAME[k]}</span>`).join('');
  }

  // screens
  if (now - lastDraw > 1/15) {
    lastDraw = now;
    let src = null, title = '';
    if (scen === 'pc') { drawPC(); pcTex.needsUpdate = true; if (actors.pc.monitor.on) { src = pcCanvas; title = '모니터 화면'; } }
    else {
      drawConsole(); consTex.needsUpdate = true;
      if (S.phase) {
        const ph = PH[S.phase];
        if (ph.where === 'laptop') { drawTerm(lapCanvas, ph, S.prog); src = lapCanvas; }
        else src = consCanvas;
        title = ph.title;
      }
    }
    scrEl.hidden = !src;
    if (src) {
      if (scrCanvas.width !== src.width || scrCanvas.height !== src.height) { scrCanvas.width = src.width; scrCanvas.height = src.height; }
      scrCanvas.getContext('2d').drawImage(src, 0, 0); $('scrTitle').textContent = title;
    }
  }

  // highlight
  const animIds = anim ? anim.ids : [];
  for (const a of Object.values(actors[scen])) {
    if (!a.group) continue;
    const k = animIds.includes(a.id) ? 0.32 + 0.18*Math.sin(now*7) : a === hover ? 0.18 : a === selectedActor && selected ? 0.12 : 0;
    if (Math.abs(k - a.hl) < 0.001) continue;
    a.hl = k; for (const m of a.mats) { m.emissive.copy(ACC); m.emissiveIntensity = k; }
  }
  const tagA = animIds.length ? actors[scen][animIds[0]] : (selected && selectedActor ? selectedActor : null);
  if (tagA && tagA.group && (tagA.on || animIds.length || !tagA.cables)) {
    bb.setFromObject(tagA.group); bb.getCenter(bc); bc.y = bb.max.y + (scen === 'srv' ? 3 : 1);
    bc.project(camera);
    const x = (bc.x*0.5 + 0.5)*stage.clientWidth, y = (-bc.y*0.5 + 0.5)*stage.clientHeight;
    tagTxt.textContent = INFO[tagA.info].name;
    tagEl.style.transform = bc.z < 1 ? `translate(${Math.round(x - 5)}px, ${Math.round(y - 30)}px)` : 'translate(-9999px,0)';
  } else tagEl.style.transform = 'translate(-9999px,0)';

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

setScenario('pc');
frame();
</script>
</body>
